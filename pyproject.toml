[project]
name = "crypt-master"
version = "0.2.0"
description = "Automated cryptocurrency trading system with Pionex exchange integration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
keywords = ["cryptocurrency", "trading", "pionex", "bot", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    # Django and web framework
    "django>=5.1",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "channels>=4.1",
    "channels-redis>=4.2",
    "daphne>=4.1",
    "gunicorn>=23.0",
    # Database
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.2",
    # Async and task queue
    "celery>=5.4",
    "redis>=5.0",
    # HTTP client
    "httpx>=0.27",
    "aiohttp>=3.10",
    # Technical analysis
    "numpy>=2.0",
    "pandas>=2.2",
    "ta-lib>=0.4",
    # Configuration and environment
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Utilities
    "structlog>=24.4",
    "cryptography>=46.0.4",
    "django-celery-beat>=2.8.1",
    "websockets>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs>=5.0",
    "djangorestframework-stubs>=3.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "apps", "agents", "lib"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"agents/*.py" = ["E402"]  # Allow imports after django.setup()
"tests/**/*.py" = ["E402", "F841"]  # Allow imports after django.setup() and unused variables in tests
"lib/backtesting/__init__.py" = ["F401", "F841"]  # Allow unused imports for public API
"lib/logging/__init__.py" = ["F401", "F841"]  # Allow unused imports
"lib/simulation/__init__.py" = ["F401"]  # Allow unused imports

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true

[tool.django-stubs]
django_settings_module = "config.settings"

[dependency-groups]
dev = [
    "beautifulsoup4>=4.14.3",
]
